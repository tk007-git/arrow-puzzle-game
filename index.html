<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Arrow Escape</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="game">

    <!-- HEADER -->

    <header class="header">

        <button
            class="icon-button"
            id="backButton"
        >
            ‹
        </button>

        <h1>
            Arrow Escape
        </h1>

        <button
            class="icon-button"
            id="settingsButton"
        >
            ⚙
        </button>

    </header>


    <!-- LEVEL -->

    <div class="level">
        Level
        <span id="levelNumber">
            1
        </span>
    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-box">

            <span>
                ➤
            </span>

            <strong id="moves">
                0
            </strong>

        </div>


        <div class="lives">

            <span id="heart1">
                ❤️
            </span>

            <span id="heart2">
                ❤️
            </span>

            <span id="heart3">
                ❤️
            </span>

        </div>


        <div class="difficulty">

            <span id="difficulty">
                Easy
            </span>

        </div>

    </div>


    <!-- GAME BOARD -->

    <div
        id="gameBoard"
        class="game-board"
    >

    </div>


    <!-- BOTTOM CONTROLS -->

    <div class="controls">

        <button
            id="hintButton"
            class="control-button"
        >

            💡

            <span class="hint-count">
                2
            </span>

        </button>


        <button
            id="restartButton"
            class="control-button"
        >

            🔄

        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    >
        Tap arrows to clear the board
    </div>


    <!-- GAME OVER -->

    <div
        id="gameOver"
        class="overlay hidden"
    >

        <div class="popup">

            <h2>
                Game Over
            </h2>

            <p>
                Try again!
            </p>

            <button
                id="tryAgainButton"
            >
                Try Again
            </button>

        </div>

    </div>


    <!-- LEVEL COMPLETE -->

    <div
        id="levelComplete"
        class="overlay hidden"
    >

        <div class="popup">

            <h2>
                🎉 Level Complete!
            </h2>

            <p>
                Great job!
            </p>

            <button
                id="nextLevelButton"
            >
                Next Level
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
