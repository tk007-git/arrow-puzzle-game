<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrow Puzzle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>⬆️ Arrow Puzzle</h1>

        <p class="subtitle">
            Click the arrows in the correct direction!
        </p>

        <div class="game-info">

            <div class="info-box">
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div class="info-box">
                <span>Lives</span>
                <strong id="lives">3</strong>
            </div>

            <div class="info-box">
                <span>Time</span>
                <strong id="timer">30</strong>
            </div>

        </div>

        <div id="message">
            Find the arrow pointing:
            <strong id="target-direction">UP</strong>
        </div>

        <div id="game-board"></div>

        <button id="start-button">
            Start Game
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
